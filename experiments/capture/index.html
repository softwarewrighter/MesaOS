<!doctype html>
<meta charset="utf-8">
<title>MesaOS xclock capture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #191724; overflow: hidden; }
  #screen { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; }
</style>
<div id="screen"></div>
<script type="module">
  import RFB from "/novnc/core/rfb.js";
  const rfb = new RFB(document.getElementById("screen"), `ws://${location.host}/websockify`);
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.focusOnClick = true;
  window.rfb = rfb;
  rfb.addEventListener("connect", () => { document.title = "MesaOS VNC connected"; });
</script>
